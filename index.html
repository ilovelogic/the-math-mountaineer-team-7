<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Math Mountaineer</title>
    <style>
      body { margin: 0; height: 100vh; display: grid; place-items: center; overflow: hidden; }
    </style>
    <!--
      Optional documentation
      - margin: 0: removes the browser's default 8px page margin, which would otherwise add scrollbars.
      - height: 100vh: makes the page exactly as tall as the window (vh is 1% of the window's height).
      - display: grid / place-items: center: centres the game horizontally and vertically.
      - overflow: hidden: hides scrollbars that can flash briefly while the window is being resized.
    -->
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
